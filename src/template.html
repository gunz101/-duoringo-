<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- security: the page may not load or send anything over the network (no outside scripts, no fetch/XHR/beacons) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>ヅオリンゴー · Japanese Course · 日本語コース</title>
<style>
  :root{
    --bg:#0f1115; --bg2:#171a21; --bg3:#1f242e; --line:#2b323d;
    --fg:#e8ecf2; --muted:#9aa3b2; --faint:#7e8896;
    --accent:#7c8cff; --green:#36c98d; --amber:#ffb454; --blue:#56b6ff; --pink:#ff7eb6; --red:#ff5e6c;
    --radius:16px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans JP",sans-serif;
    --jp:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:dark}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.55;-webkit-font-smoothing:antialiased;font-size:15px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  a{color:var(--blue)}
  button{font:inherit;color:inherit;cursor:pointer}
  .jp{font-family:var(--jp)}
  .wrap{max-width:860px;margin:0 auto;padding:18px 16px 80px}
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0 12px}
  header.top h1{font-size:20px;font-weight:700;letter-spacing:.2px}
  header.top h1 .jp{color:var(--accent);margin-left:6px}
  header.top .lede{color:var(--muted);font-size:13px;width:100%}
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  nav.tabs a{padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-decoration:none;font-size:13px;background:var(--bg2)}
  nav.tabs a.on{background:var(--accent);border-color:var(--accent);color:#0b0d12;font-weight:600}
  .bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 -16px 14px;padding:10px 16px}
  .barrow{display:flex;align-items:center;gap:12px}
  .prog{flex:1;height:8px;background:var(--bg3);border-radius:999px;overflow:hidden}
  .prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--blue));transition:width .3s}
  .pct{font-size:13px;color:var(--muted);white-space:nowrap}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
  .muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);font-size:13px;text-decoration:none}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0d12;font-weight:600}
  .btn.ghost{background:transparent}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted);background:var(--bg3)}
  .pill.n5{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
  .pill.n4{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,transparent)}
  .pill.n3{color:var(--pink);border-color:color-mix(in srgb,var(--pink) 40%,transparent)}
  .pill.kana{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent)}
  input[type=search],textarea{width:100%;background:var(--bg3);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:9px 11px;font:inherit}
  textarea{min-height:90px;resize:vertical;font-size:14px}
  /* units / trail */
  details.unit{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);margin:10px 0;overflow:hidden}
  details.unit>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px}
  details.unit>summary::-webkit-details-marker{display:none}
  .unum{min-width:40px;height:40px;border-radius:12px;background:var(--bg3);display:grid;place-items:center;font-weight:700;color:var(--accent);font-size:13px}
  .utitle{flex:1;min-width:0}.utitle b{display:block;font-size:15px}.utitle span{font-size:12px;color:var(--muted)}
  .mini{width:70px;height:6px;background:var(--bg3);border-radius:999px;overflow:hidden}.mini>i{display:block;height:100%;background:var(--green)}
  .chev{color:var(--faint);transition:transform .2s}details[open]>summary .chev{transform:rotate(90deg)}
  .alist{border-top:1px solid var(--line)}
  .aitem{display:flex;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
  .aitem:first-child{border-top:none}.aitem:hover{background:var(--bg3)}
  .aid{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--faint);min-width:44px}
  .atxt{flex:1;min-width:0}.atxt b{font-size:14px}.atxt .pts{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .astate{font-size:12px;white-space:nowrap}.astate.done{color:var(--green)}.astate.go{color:var(--amber)}
  .aitem.locked{opacity:.45;pointer-events:none}
  .aitem.milestone .atxt b::before{content:"🏁 "}
  .hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .hero .big{font-size:34px;font-weight:800;color:var(--accent)}
  /* aula */
  .ahead h2{font-size:24px;line-height:1.25}.ahead .jp{font-size:18px;color:var(--accent)}
  .toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .toc button{background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
  .toc button:hover{color:var(--fg);border-color:var(--accent)}
  section.blk{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0;scroll-margin-top:70px}
  section.blk>h3{font-size:16px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
  section.blk>h3 .n{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#0b0d12;display:grid;place-items:center;font-size:13px;font-weight:800}
  ul.clean{list-style:none}ul.clean li{padding:4px 0 4px 22px;position:relative}ul.clean li::before{content:"✓";position:absolute;left:2px;color:var(--green)}
  ol.steps{padding-left:22px}ol.steps li{margin:4px 0}
  .dur{display:grid;grid-template-columns:1fr auto;gap:6px 12px}.dur .m{color:var(--amber);font-variant-numeric:tabular-nums;text-align:right}
  .durbar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin:8px 0 12px;background:var(--bg3)}
  .durbar i{display:block;height:100%}
  .vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}
  .voc{background:var(--bg3);border-radius:10px;padding:8px 10px;cursor:pointer;border:1px solid transparent}.voc:hover{border-color:var(--line)}
  .voc .j{font-family:var(--jp);font-size:17px}.voc .r{font-size:12px;color:var(--muted)}.voc .p{font-size:13px}
  .point{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.point:first-of-type{border-top:none;padding-top:0;margin-top:0}
  .phead{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .phead h4{font-size:18px;font-family:var(--jp);flex:1;min-width:180px}.phead h4 small{font-family:var(--font);font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
  .cb{border:1px solid var(--line);background:var(--bg3);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
  .cb.s.on{background:color-mix(in srgb,var(--green) 22%,transparent);border-color:var(--green);color:var(--fg)}
  .cb.w.on{background:color-mix(in srgb,var(--blue) 22%,transparent);border-color:var(--blue);color:var(--fg)}
  .cb.nt.on{border-color:var(--pink);color:var(--pink)}
  .expl{margin:8px 0}.expl p{margin:6px 0}.expl ul,.md ul{padding-left:22px;margin:6px 0}.expl li{margin:3px 0}
  .struct{display:inline-block;font-family:var(--jp);background:var(--bg3);border:1px dashed var(--line);border-radius:8px;padding:4px 10px;margin:4px 0 8px;color:var(--amber)}
  .ex{display:grid;gap:8px;margin:8px 0}
  .exrow{background:var(--bg3);border-radius:12px;padding:10px 12px}
  .exrow .j{font-family:var(--jp);font-size:18px;line-height:1.5}
  .exrow .k{font-family:var(--jp);font-size:13px;color:var(--faint)}
  .exrow .r{font-size:13px;color:var(--muted);font-style:italic}
  .exrow .p{font-size:14px}.exrow .p::before{content:"→ ";color:var(--faint)}
  .exrow .tools{float:right;display:flex;gap:4px}
  .ibtn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:2px 7px;font-size:13px;color:var(--muted)}.ibtn:hover{color:var(--fg);border-color:var(--accent)}
  .anat{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{border:1px solid var(--c,var(--line));border-radius:10px;padding:4px 8px 3px;background:color-mix(in srgb,var(--c,#888) 12%,transparent);text-align:center;min-width:52px}
  .chip .t{font-family:var(--jp);font-size:15px}.chip .t em{font-style:normal;color:var(--c);font-weight:700}
  .chip .l{font-size:10px;letter-spacing:.4px;color:var(--c);font-weight:700;text-transform:uppercase}
  .chip.pred{border-width:2px}
  .anatnote{font-size:12px;color:var(--faint);margin-top:4px}
  .pit{background:color-mix(in srgb,var(--red) 8%,transparent);border-left:3px solid var(--red);border-radius:8px;padding:8px 12px;margin:8px 0}
  .pit b{color:var(--red);font-size:13px}.pit ul{padding-left:18px;margin-top:4px}.pit li{margin:3px 0;font-size:14px}
  .flag{background:color-mix(in srgb,var(--amber) 12%,transparent);border-left:3px solid var(--amber);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px}
  .note{margin-top:8px}.note textarea{min-height:70px}
  .study{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:10px 0}
  .study b{font-family:var(--jp)}
  .media{display:grid;gap:8px}.med{display:flex;gap:10px;align-items:flex-start;background:var(--bg3);border-radius:12px;padding:10px 12px}
  .med .o{min-width:24px;height:24px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:12px;color:var(--accent);font-weight:700}
  .med .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint)}
  .task{margin:12px 0}.task h5{font-size:14px;margin-bottom:6px}
  .hwi{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 0;border-top:1px dashed var(--line)}
  .hwi .q{font-family:var(--jp)}.hwi .num{color:var(--faint);font-size:13px}
  .ans{grid-column:2;display:none;background:color-mix(in srgb,var(--green) 10%,transparent);border-radius:8px;padding:6px 10px}
  .ans.show{display:block}.ans .j{font-family:var(--jp);font-size:16px}.ans .r{font-size:13px;color:var(--muted);font-style:italic}
  .reveal{grid-column:2;justify-self:start;font-size:12px}
  .wb{display:flex;gap:10px;align-items:baseline;padding:4px 0}.wb .pg{font-family:ui-monospace,Consolas,monospace;color:var(--amber);min-width:52px}
  .prac{display:grid;gap:8px}.pr{display:flex;gap:10px;background:var(--bg3);border-radius:12px;padding:10px 12px}
  .pr .tool{min-width:92px;font-weight:700;font-size:13px}.pr .min{margin-left:auto;color:var(--amber);font-size:13px;white-space:nowrap}
  .cult h4{font-size:17px}.cult .try{margin-top:10px;background:var(--bg3);border-radius:10px;padding:8px 12px}
  .chk label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--line);cursor:pointer}
  .chk label:first-child{border-top:none}.chk input{margin-top:4px;width:18px;height:18px;accent-color:var(--green)}
  .done-banner{background:color-mix(in srgb,var(--green) 16%,transparent);border:1px solid var(--green);border-radius:12px;padding:10px 14px;margin-top:10px;display:none}
  .done-banner.show{display:block}
  .anav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
  /* rotina */
  .grid7{display:grid;grid-template-columns:minmax(110px,1.4fr) repeat(7,1fr);gap:4px;align-items:center;font-size:13px}
  .grid7 .h{color:var(--faint);text-align:center;font-size:12px}
  .grid7 button{height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg3)}
  .grid7 button.on{background:var(--green);border-color:var(--green)}
  .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;margin-left:6px}
  .tag.core{background:color-mix(in srgb,var(--green) 20%,transparent);color:var(--green)}
  .tag.flex{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
  .md p{margin:6px 0}.md ul{padding-left:20px}.md li{margin:3px 0}
  h2.sec{font-size:18px;margin:18px 0 6px}
  .res{display:grid;gap:8px}.resi{background:var(--bg3);border-radius:12px;padding:10px 12px}
  .resi .t{font-weight:600}.resi .d{font-size:13px;color:var(--muted)}
  .savebadge{text-decoration:none;margin-left:4px;white-space:nowrap}.savebadge:hover{color:var(--fg)}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  @media (max-width:560px){ .exrow .j{font-size:16px} .pr{flex-wrap:wrap} .pr .tool{min-width:0} .grid7{grid-template-columns:90px repeat(7,1fr)} nav.tabs{margin-left:0} }
  @media print{ .bar,nav.tabs,.tools,.cb,.reveal,.anav,.toc{display:none!important} .ans{display:block!important} body{background:#fff;color:#000} section.blk,.card{border-color:#ccc;background:#fff} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>ヅオリンゴー <span class="jp">日本語コース</span></h1>
    <nav class="tabs" id="tabs">
      <a href="#/" data-v="home">Path</a>
      <a href="#/rotina" data-v="rotina">Routine</a>
      <a href="#/guia" data-v="guia">Guide</a>
      <a href="#/recursos" data-v="recursos">Resources</a>
      <a href="#/progresso" data-v="progresso">Progress</a>

    <div class="lede" id="lede"></div>
  </header>
  <div class="bar"><div class="barrow"><div class="prog"><i id="progbar"></i></div><div class="pct" id="pct"></div><a class="pct savebadge" id="savebadge" href="#/progresso" title="Saving"></a></div></div>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>
<script>/*__STORE_JS__*/</script>
<script>window.CURSO = /*__CURSO_DATA__*/null;</script>
<script>
'use strict';
(function () {
  var C = window.CURSO;
  var KEY = 'curso_jp_v1';
  var ROLE_PT = {
    predicate: 'PREDICATE', topic: 'TOPIC', also: 'ALSO', subject: 'SUBJECT', object: 'OBJECT', place: 'PLACE (ACTION)',
    means: 'MEANS', time: 'TIME', destination: 'DESTINATION', location: 'WHERE IT IS', target: 'TARGET', purpose: 'PURPOSE',
    with: 'WITH WHOM', and: 'AND (LIST)', tari: 'ACTIONS (E.G.)', compare: 'COMPARED TO', from: 'FROM / SINCE', until: 'UNTIL',
    reason: 'REASON', modifier: 'DESCRIBES NEXT', how: 'HOW', quantity: 'QUANTITY', link: 'LINK (AND…)',
    contrast: 'BUT', condition: 'CONDITION', quote: 'QUOTE', connector: 'CONNECTOR', interjection: 'INTERJECTION',
    only: 'ONLY', indef: 'SOMETHING / SOMEONE', indefneg: 'NOTHING / NOBODY', while: 'WHILE', after: 'AFTER DOING', vocative: 'CALLING', bare: 'NO PARTICLE'
  };
  var ROLE_Q = { predicate: 'What happens / what is it?', topic: 'About what?', subject: 'Who / what?', object: 'What (is acted on)?', place: 'Where does it happen?', means: 'With what / how?', time: 'When?', destination: 'Where to?', location: 'Where is it?', target: 'To whom / onto what?', purpose: 'To do what?', with: 'With whom?', modifier: 'Which / whose?', how: 'How?', reason: 'Why?', from: 'From where / since when?', until: 'Until where / when?', compare: 'Compared to what?', also: 'Also?', quantity: 'How many / how much?', vocative: 'Who is spoken to?', bare: 'Guess from the verb (particle dropped)' };
  var KIND_PT = { action: 'action', existence: 'existence', identity: 'identity (is)', description: 'description', request: 'request', wish: 'wish', invitation: 'invitation / suggestion', progress: 'in progress / state', explanation: 'explanation (〜んです)', experience: 'experience', intention: 'intention', obligation: 'obligation', setphrase: 'set phrase', permission: 'permission', prohibition: 'prohibition' };
  var DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  // ---------- state: src/store.js (localStorage + IndexedDB mirror + restore points + optional synced file) ----------
  function norm(s) { s.pts = s.pts || {}; s.chk = s.chk || {}; s.hw = s.hw || {}; s.notes = s.notes || {}; s.rot = s.rot || {}; return s; }
  var REPLACE_MSG = { 'file': '📁 Progress synced with your file', 'imported': 'Backup imported', 'restored': 'Restore point applied', 'wiped': 'Progress wiped — you can undo it under Restore points', 'recovered': "Progress recovered from the browser's backup copy" };
  var CUR_VIEW = 'home';
  var STORE = window.CursoStore.createStore({
    onReplace: function (ns, why) { S = norm(ns); route(true); if (REPLACE_MSG[why]) toast(REPLACE_MSG[why]); },
    onStatus: function () { renderSaveBadge(); if (CUR_VIEW === 'progresso') renderSaveCard(); }
  });
  var S = norm(STORE.state);
  function save() { STORE.save(); }
  function toast(m) { var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 1800); }

  // ---------- data helpers ----------
  var MAP = [], BYID = {}, UNIT_OF = {};
  C.curso.units.forEach(function (u, ui) { u.aulas.forEach(function (a) { var m = Object.assign({ unit: u.id, unitIdx: ui }, a); MAP.push(m); BYID[a.id] = m; UNIT_OF[a.id] = u; }); });
  function aula(id) { return C.aulas[id] || null; }
  function isDone(id) { var a = aula(id); if (!a) return false; var c = S.chk[id] || []; return a.checklist.length > 0 && a.checklist.every(function (_, i) { return !!c[i]; }); }
  function chkCount(id) { var a = aula(id); if (!a) return [0, 0]; var c = S.chk[id] || []; return [a.checklist.filter(function (_, i) { return !!c[i]; }).length, a.checklist.length]; }
  function nextAula() { for (var i = 0; i < MAP.length; i++) if (aula(MAP[i].id) && !isDone(MAP[i].id)) return MAP[i].id; return null; }
  function started(id) { var n = chkCount(id)[0]; if (n) return true; var a = aula(id); return !!(a && a.grammar.some(function (g) { var p = S.pts[g.id]; return p && (p.s || p.w || p.note); })) || !!S.notes[id]; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function md(s) {
    var lines = esc(s).split('\n'), out = [], inList = false;
    lines.forEach(function (l) {
      l = l.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
      if (/^\s*•\s*/.test(l)) { if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + l.replace(/^\s*•\s*/, '') + '</li>'); }
      else { if (inList) { out.push('</ul>'); inList = false; } if (l.trim()) out.push('<p>' + l + '</p>'); }
    });
    if (inList) out.push('</ul>');
    return out.join('');
  }
  function levelPill(u) { var l = (u.level || '').toLowerCase(); var cls = /n5/.test(l) ? 'n5' : /n4/.test(l) ? 'n4' : /n3/.test(l) ? 'n3' : 'kana'; return '<span class="pill ' + cls + '">' + esc(u.level || '') + '</span>'; }

  // ---------- speech ----------
  var jaVoice = null;
  function pickVoice() { try { var v = speechSynthesis.getVoices(); jaVoice = v.filter(function (x) { return /ja|JP/i.test(x.lang); })[0] || null; } catch (e) {} }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

    h += '<div class="card"><h2 class="sec" style="margin-top:0">This week</h2><p class="small muted">Tick what you did. There are no dates: start a new week whenever you like.</p><div class="grid7"><div></div>' + DAYS.map(function (d) { return '<div class="h">' + d + '</div>'; }).join('') +
      R.blocks.map(function (b) { return '<div>' + esc(b.short || b.name) + '</div>' + DAYS.map(function (_, di) { var k = b.key + '_' + di; return '<button data-rot="' + k + '" class="' + (S.rot[k] ? 'on' : '') + '" aria-label="' + esc(b.name + ' ' + DAYS[di]) + '"></button>'; }).join(''); }).join('') +
      '</div><div class="row" style="margin-top:10px"><span class="small muted" id="rotcount"></span><button class="btn ghost" id="rotreset" style="margin-left:auto">New week (clear)</button></div></div>';
    if (R.cycle) h += '<div class="card"><h2 class="sec" style="margin-top:0">' + esc(R.cycle.title) + '</h2><div class="md">' + md(R.cycle.body) + '</div></div>';
    if (R.week) h += '<div class="card"><h2 class="sec" style="margin-top:0">' + esc(R.week.title) + '</h2><div class="md">' + md(R.week.body) + '</div></div>';
    view.innerHTML = h;
    var cnt = function () { var core = R.blocks.filter(function (b) { return b.core; })[0]; var n = core ? DAYS.filter(function (_, di) { return S.rot[core.key + '_' + di]; }).length : 0; document.getElementById('rotcount').textContent = core ? 'Days with ' + core.short.toLowerCase() + ': ' + n + '/7' : ''; };
    cnt();
    view.onclick = function (e) {
      var t = e.target.closest('button'); if (!t) return;
      if (t.hasAttribute('data-rot')) { var k = t.getAttribute('data-rot'); if (S.rot[k]) delete S.rot[k]; else S.rot[k] = true; t.classList.toggle('on', !!S.rot[k]); save(); cnt(); }
      if (t.id === 'rotreset') { if (confirm("Clear this week's marks?")) { S.rot = {}; save(); renderRotina(); } }
    };
    view.onchange = view.oninput = null;
  }

  // ----- guia / recursos / progresso -----
  function renderGuia() {
    var G = C.curso.guia; document.getElementById('lede').textContent = 'How to follow the course to the end.';
    if (!G) { view.innerHTML = '<div class="empty">Guide coming soon.</div>'; return; }
    view.innerHTML = G.sections.map(function (s) { return '<div class="card"><h2 style="font-size:18px">' + esc(s.title) + '</h2><div class="md">' + md(s.body) + '</div></div>'; }).join('');
    view.onclick = view.onchange = view.oninput = null;
  }
  function renderRecursos() {
    var R = C.recursos; document.getElementById('lede').textContent = 'What to study and practice outside the course, by level.';
    if (!R) { view.innerHTML = '<div class="empty">Resources coming soon.</div>'; return; }
    var h = (R.intro ? '<div class="card md">' + md(R.intro) + '</div>' : '');
    R.groups.forEach(function (g) {
      h += '<h2 class="sec">' + esc(g.title) + '</h2>' + (g.note ? '<p class="small muted">' + esc(g.note) + '</p>' : '') + '<div class="res">' + g.items.map(function (it) {
        return '<div class="resi"><div class="t">' + (it.url ? '<a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.name) + '</a>' : esc(it.name)) + ' <span class="pill">' + esc(it.type || '') + '</span>' + (it.level ? ' <span class="pill">' + esc(it.level) + '</span>' : '') + (it.cost ? ' <span class="pill">' + esc(it.cost) + '</span>' : '') + '</div><div class="d">' + esc(it.desc || '') + '</div>' + (it.how ? '<div class="small">👉 ' + esc(it.how) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
    });
    view.innerHTML = h;
    view.onclick = view.onchange = view.oninput = null;
  }
  function renderProgresso() {
    document.getElementById('lede').textContent = 'Your progress: by mastery, not by calendar.';
    var total = MAP.length, done = MAP.filter(function (m) { return isDone(m.id); }).length, pts = 0, ptsS = 0, ptsW = 0, hw = 0, written = 0;
    MAP.forEach(function (m) { var a = aula(m.id); if (!a) return; written++; a.grammar.forEach(function (g) { pts++; var p = S.pts[g.id]; if (p && p.s) ptsS++; if (p && p.w) ptsW++; }); if (S.hw[m.id] && S.hw[m.id].done) hw++; });
    var ms = MAP.filter(function (m) { return m.milestone; });
    var h = '<div class="card hero"><div class="big">' + (total ? Math.round(done / total * 100) : 0) + '%</div><div><div><b>' + done + '</b> of ' + total + ' lessons mastered</div><div class="small muted">✍️ ' + ptsS + '/' + pts + ' points studied · 📱 ' + ptsW + ' practiced · 📓 ' + hw + ' homework done</div></div></div>';
    h += '<div class="card"><h2 class="sec" style="margin-top:0">Milestones</h2>' + ms.map(function (m) { return '<div class="wb"><span class="pg">' + (isDone(m.id) ? '🏁' : '◻') + '</span><a href="#/aula/' + m.id + '">' + esc(m.title) + '</a></div>'; }).join('') + '</div>';
    h += '<div class="card"><h2 class="sec" style="margin-top:0">By unit</h2>' + C.curso.units.map(function (u) { var d = u.aulas.filter(function (a) { return isDone(a.id); }).length; return '<div class="row" style="margin:6px 0"><span style="flex:1">' + esc(u.name) + '</span><div class="mini" style="width:120px"><i style="width:' + (d / u.aulas.length * 100) + '%"></i></div><span class="small muted" style="width:44px;text-align:right">' + d + '/' + u.aulas.length + '</span></div>'; }).join('') + '</div>';
    h += '<div class="card" id="savecard"></div>';
    view.innerHTML = h;
    view.onchange = view.oninput = null;
    renderSaveCard();
    view.onclick = function (e) {
      var t = e.target.closest('button'); if (!t) return;
      var fail = function (err) { if (err && err.name === 'AbortError') return; toast('⚠ ' + ((err && err.message) || err)); };
      if (t.id === 'exp') downloadText(STORE.exportText(), 'duoringo-progress-' + stampName() + '.json');
      if (t.id === 'gcimp') importGC();
      if (t.id === 'fnew') STORE.connectNew().then(function () { toast('📁 Progress file connected'); }, fail);
      if (t.id === 'fopen') STORE.connectExisting().then(function () { toast('📁 File connected and merged'); }, fail);
      if (t.id === 'frec') STORE.reconnect().then(function () { toast('📁 File reconnected'); }, fail);
      if (t.id === 'foff') { if (confirm('Disconnect the file? Your progress stays saved in this browser.')) STORE.disconnect(); }
      if (t.id === 'snapnow') STORE.snapshot('manual', true).then(function () { toast('🕘 Restore point created'); renderSaveCard(); });
      if (t.hasAttribute('data-restore')) { if (confirm('Go back to this point? (Your current state becomes a restore point first.)')) STORE.restoreSnapshot(+t.getAttribute('data-restore')).catch(fail); }
      if (t.id === 'wipe') { if (confirm('Wipe ALL course progress? You can undo it under "Restore points".')) STORE.wipe(); }
    };
  }
  function stampName() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function hhmm(ts) { if (!ts) return ''; var d = new Date(ts); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
  function when(ts) { var d = new Date(ts); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' + hhmm(ts); }
  function downloadText(text, name) {
    var blob = new Blob([text], { type: 'application/json' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function mapN() { return MAP.filter(function (m) { return aula(m.id); }).map(function (m) { return { id: m.id, n: aula(m.id).checklist.length }; }); }
  function renderSaveBadge() {
    var el = document.getElementById('savebadge'); if (!el) return;
    var st = STORE.status, txt = '💾' + (st.saved ? ' ' + hhmm(st.saved) : ''), tip = st.saved ? 'Saved at ' + hhmm(st.saved) + ' (in this browser, double copy)' : 'Autosave on';
    if (st.file) { var ok = st.filePerm === 'granted' && !st.fileError; txt += ok ? ' · 📁' : ' · 📁⚠'; tip += ok ? ' · file ' + st.file + (st.fileSync ? ' synced at ' + hhmm(st.fileSync) : '') : ' · the file needs to be reconnected (Progress tab)'; }
    el.textContent = txt; el.title = tip;
  }
  function renderSaveCard() {
    var box = document.getElementById('savecard'); if (!box) return;
    var st = STORE.status, h = '<h2 class="sec" style="margin-top:0">💾 Saving and backup</h2>';
    h += '<div class="small" style="display:grid;gap:4px">';
    h += '<div>' + (st.lsError ? '⚠ The main storage is full/blocked: using only the IndexedDB copy.' : '✅ Saved automatically in this browser, as a <b>double copy</b> (localStorage + IndexedDB)' + (st.saved ? ' · last change at ' + hhmm(st.saved) : '') + '.') + '</div>';
    h += '<div>' + (st.persisted === true ? '🔒 <b>Persistent</b> storage: the browser will not delete this data on its own.' : st.persisted === false ? '⚠ The browser may clear site data when space runs low: connect a file below or export now and then.' : '… checking whether storage is persistent.') + '</div>';
    h += '<div>🕘 Automatic restore points (the last 30) protect against mistakes and bad imports.</div></div>';
    // synced file
    h += '<h3 style="font-size:14px;margin:14px 0 6px">📁 Synced progress file</h3>';
    if (!STORE.hasFileAPI) h += '<p class="small muted">Available in Edge/Chrome on a computer. In this browser, carry your progress with <b>Export</b> and <b>Import &amp; merge</b>.</p>';
    else if (!st.file) h += '<p class="small muted">Connect a file once: the course writes to it on every change and re-reads it when you come back to the tab. Keep it in a <b>OneDrive/Google Drive</b> folder and connect the same file on the website, the local file and inside the app — your progress is the same everywhere. Connecting a file that already has progress <b>merges</b> it, deleting nothing.</p><div class="row"><button class="btn primary" id="fnew">Create a progress file</button><button class="btn" id="fopen">Use an existing file</button></div>';
    else h += '<div class="row"><span class="small">📁 <b>' + esc(st.file) + '</b> · ' + (st.filePerm === 'granted' ? (st.fileSync ? 'synced at ' + hhmm(st.fileSync) : 'connected') : '<span style="color:var(--amber)">needs permission again</span>') + '</span>' + (st.filePerm !== 'granted' ? '<button class="btn primary" id="frec">🔄 Reconnect</button>' : '') + '<button class="btn ghost" id="foff">Disconnect</button></div>' + (st.fileError ? '<p class="small" style="color:var(--amber)">⚠ ' + esc(st.fileError) + '</p>' : '');
    // export / import
    h += '<h3 style="font-size:14px;margin:14px 0 6px">⇅ Export / import</h3><div class="row"><button class="btn" id="exp">⬇ Export backup</button><label class="btn">⬆ Import &amp; merge<input type="file" id="impm" accept="application/json,.json" hidden></label><label class="btn">⬆ Import &amp; replace<input type="file" id="impr" accept="application/json,.json" hidden></label><button class="btn" id="gcimp">Import from genki-companion</button></div>';
    h += '<p class="small muted" style="margin-top:6px"><b>Merge</b> combines both sides (the most recent change of each item wins; two different notes are both kept). <b>Replace</b> swaps everything for the backup. Backups carry a checksum: a corrupted or edited file is rejected. Nothing leaves your computer — the course never uses the internet to save.</p>';
    // restore points
    h += '<details style="margin-top:10px"><summary style="cursor:pointer" class="small">🕘 Restore points</summary><div id="snaps" class="small muted" style="margin-top:6px">loading…</div><div class="row" style="margin-top:6px"><button class="btn ghost" id="snapnow">Create a point now</button><button class="btn ghost" id="wipe" style="margin-left:auto">Wipe everything</button></div></details>';
    box.innerHTML = h;
    var imp = function (mode) { return function (e) {
      var f = e.target.files[0]; if (!f) return;
      f.text().then(function (text) { return STORE.importText(text, mode); }).then(function () { if (mode !== 'replace') toast('Backup merged into your progress'); }, function (err) { toast('⚠ Not imported: ' + (err.message || err)); });
      e.target.value = '';
    }; };
    document.getElementById('impm').onchange = imp('merge');
    document.getElementById('impr').onchange = function (e) { if (!confirm('Replace ALL progress with this backup? (Your current state becomes a restore point first.)')) { e.target.value = ''; return; } imp('replace')(e); };
    STORE.listSnapshots().then(function (list) {
      var el = document.getElementById('snaps'); if (!el) return;
      if (!list || !list.length) { el.textContent = 'No points yet — they appear as you study.'; return; }
      var M = mapN();
      el.innerHTML = list.slice(0, 30).map(function (x) { var s = window.CursoStore.stats(x.state, M); return '<div class="wb"><span class="pg" style="min-width:92px">' + when(x.ts) + '</span><span style="flex:1">' + esc(x.why) + ' · ' + s.mastered + ' lessons mastered · ✍️ ' + s.studied + '</span><button class="ibtn" data-restore="' + x.id + '">Restore</button></div>'; }).join('');
    });
  }
  function importGC() {
    var raw = null; try { raw = localStorage.getItem('genki_companion_v1'); } catch (e) {}
    if (!raw) { toast('No genki-companion data found in this browser'); return; }
    var g; try { g = JSON.parse(raw); } catch (e) { toast('genki-companion data is unreadable'); return; }
    var n = 0;
    MAP.forEach(function (m) { var a = aula(m.id); if (!a) return; a.grammar.forEach(function (pt) {
      if (!pt.gc) return; var s = !!g[pt.gc + '_s'], w = !!g[pt.gc + '_w'], note = g[pt.gc + '_note'];
      if (!s && !w && !note) return; var p = S.pts[pt.id] = S.pts[pt.id] || {};
      if (s) p.s = true; if (w) p.w = true; if (note && !p.note) p.note = note; n++;
    }); });
    S.imported = true; save(); toast(n + ' points imported from genki-companion'); renderProgresso();
  }

  route();
  renderSaveBadge();
  STORE.init();   // reconcile with the IndexedDB mirror and the synced file (re-renders only if something changed)
})();
</script>
</body>
</html>
